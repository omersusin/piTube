android.useAndroidX=true
kotlin.code.style=official
# Increase memory for R8/ProGuard and Kotlin compiler daemon.
# 6g heap + ParallelGC: R8 minification is the dominant CI phase and is
# memory-hungry; hosted runners have 16 GB.
org.gradle.jvmargs=-Xmx6144m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true

