name: Build piTube

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Decode signing keystore
        run: |
          mkdir -p ./keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ./keystore/piTube-release.jks
          echo "Keystore decoded to ./keystore/piTube-release.jks"
          ls -l ./keystore/piTube-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Setup Gradle with signing properties
        run: |
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore/piTube-release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # ABI splits are configured in app/build.gradle.kts, so each assemble task
      # already emits one APK per ABI plus a universal one. List them so a
      # missing split is obvious in the log rather than a silent upload failure.
      - name: List built APKs
        run: |
          echo "── debug ──"
          ls -l app/build/outputs/apk/debug/
          echo "── release ──"
          ls -l app/build/outputs/apk/release/

      # ── Debug artifacts, one per ABI ──────────────────────────────────────
      - name: Upload Debug APK (universal)
        uses: actions/upload-artifact@v7
        with:
          name: piTube-debug-universal
          path: app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: piTube-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: piTube-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: piTube-debug-x86_64
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug APK (x86)
        uses: actions/upload-artifact@v7
        with:
          name: piTube-debug-x86
          path: app/build/outputs/apk/debug/app-x86-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ── Release artifacts, one per ABI ────────────────────────────────────
      - name: Upload Release APK (universal)
        uses: actions/upload-artifact@v7
        with:
          name: piTube-release-universal
          path: app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: piTube-release-arm64-v8a
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK (armeabi-v7a)
        uses: actions/upload-artifact@v7
        with:
          name: piTube-release-armeabi-v7a
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK (x86_64)
        uses: actions/upload-artifact@v7
        with:
          name: piTube-release-x86_64
          path: app/build/outputs/apk/release/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK (x86)
        uses: actions/upload-artifact@v7
        with:
          name: piTube-release-x86
          path: app/build/outputs/apk/release/app-x86-release.apk
          if-no-files-found: error
          retention-days: 14
